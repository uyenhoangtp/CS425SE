<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>RentaCar - Customer Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<nav>
    <div class="nav-brand">RentaCar</div>
    <ul class="nav-menu">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/customers/list}">Customers</a></li>
        <li><a th:href="@{/vehicles/list}">Vehicles</a></li>
        <li><a th:href="@{/reservations/list}">Reservations</a></li>
        <li><a th:href="@{/payments/list}">Payments</a></li>
    </ul>
</nav>
<div class="container">
    <div class="form-card">
        <h2 th:text="${customer.id == null} ? 'Add Customer' : 'Edit Customer'">Customer Form</h2>
        <form th:action="@{/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" required />
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" required />
            </div>

            <div class="form-group">
                <label for="licenseNumber">License Number</label>
                <input type="text" id="licenseNumber" th:field="*{licenseNumber}" required />
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" required />
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Save</button>
                <a th:href="@{/customers/list}" class="secondary-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
