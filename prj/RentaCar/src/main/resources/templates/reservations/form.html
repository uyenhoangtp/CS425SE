<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>RentaCar - Reservation Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<nav>
    <div class="nav-brand">RentaCar</div>
    <ul class="nav-menu">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/customers/list}">Customers</a></li>
        <li><a th:href="@{/vehicles/list}">Vehicles</a></li>
        <li><a th:href="@{/reservations/list}">Reservations</a></li>
        <li><a th:href="@{/payments/list}">Payments</a></li>
    </ul>
</nav>
<div class="container">
    <div class="form-card">
        <h2>New Reservation</h2>
        <form th:action="@{/reservations/save}" method="post">
            <div class="form-group">
                <label for="customerId">Customer</label>
                <select id="customerId" name="customerId" required>
                    <option value="">Select customer</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.firstName + ' ' + customer.lastName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="vehicleId">Vehicle</label>
                <select id="vehicleId" name="vehicleId" required>
                    <option value="">Select vehicle</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.make + ' ' + vehicle.model + ' - ' + vehicle.status}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" name="startDate" required />
            </div>

            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" name="endDate" required />
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Save Reservation</button>
                <a th:href="@{/reservations/list}" class="secondary-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
