<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>RentaCar - Payment Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<nav>
    <div class="nav-brand">RentaCar</div>
    <ul class="nav-menu">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/customers/list}">Customers</a></li>
        <li><a th:href="@{/vehicles/list}">Vehicles</a></li>
        <li><a th:href="@{/reservations/list}">Reservations</a></li>
        <li><a th:href="@{/payments/list}">Payments</a></li>
    </ul>
</nav>
<div class="container">
    <div class="form-card">
        <h2>Make Payment</h2>
        <form th:action="@{/payments/save/{id}(id=${reservation.id})}" th:object="${payment}" method="post">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" step="0.01" id="amount" th:field="*{amount}" required />
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" th:field="*{paymentMethod}" required>
                    <option value="CREDIT_CARD">Credit Card</option>
                    <option value="DEBIT_CARD">Debit Card</option>
                    <option value="CASH">Cash</option>
                    <option value="BANK_TRANSFER">Bank Transfer</option>
                </select>
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Confirm Payment</button>
                <a th:href="@{/reservations/list}" class="secondary-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
