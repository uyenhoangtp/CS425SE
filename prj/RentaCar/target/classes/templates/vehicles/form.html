<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>eRegistrar - Vehicle Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<nav>
    <div class="nav-brand">eRegistrar</div>
    <ul class="nav-menu">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/customers/list}">Customers</a></li>
        <li><a th:href="@{/vehicles/list}">Vehicles</a></li>
        <li><a th:href="@{/reservations/list}">Reservations</a></li>
        <li><a th:href="@{/payments/list}">Payments</a></li>
    </ul>
</nav>
<div class="container">
    <div class="form-card">
        <h2 th:text="${vehicle.id == null} ? 'Add Vehicle' : 'Edit Vehicle'">Vehicle Form</h2>
        <form th:action="@{/vehicles/save}" th:object="${vehicle}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="plateNumber">Plate Number</label>
                <input type="text" id="plateNumber" th:field="*{plateNumber}" required />
            </div>

            <div class="form-group">
                <label for="make">Make</label>
                <input type="text" id="make" th:field="*{make}" required />
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" th:field="*{model}" required />
            </div>

            <div class="form-group">
                <label for="vehicleType">Type</label>
                <input type="text" id="vehicleType" th:field="*{vehicleType}" required />
            </div>

            <div class="form-group">
                <label for="dailyRate">Daily Rate</label>
                <input type="number" step="0.01" id="dailyRate" th:field="*{dailyRate}" required />
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}" required>
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="RENTED">RENTED</option>
                    <option value="MAINTENANCE">MAINTENANCE</option>
                </select>
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Save</button>
                <a th:href="@{/vehicles/list}" class="secondary-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
